<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SyncTune</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F4;--card:#fff;--ink:#14171C;--on:#fff;--slate:#5F6673;--line:#E3E6EC;--soft:#F3F4F7;--sig:#2F5BFF;--tint:#E8EEFF;--tx:#1D3FD1;--off:#C9CED8;--sh:0 12px 32px rgba(20,23,28,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1013;--card:#171A1F;--ink:#F2F4F8;--on:#14171C;--slate:#9AA1AE;--line:#262A31;--soft:#20242B;--tint:#1B2750;--tx:#AFC0FF;--off:#3A404A;--sh:0 12px 32px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0E1013;--card:#171A1F;--ink:#F2F4F8;--on:#14171C;--slate:#9AA1AE;--line:#262A31;--soft:#20242B;--tint:#1B2750;--tx:#AFC0FF;--off:#3A404A;--sh:0 12px 32px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px 'Plus Jakarta Sans',system-ui,sans-serif}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,#wave:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:grid;grid-template-columns:232px 1fr 300px;grid-template-rows:minmax(0,1fr) auto;gap:16px;padding:16px;box-sizing:border-box}
.pan{background:var(--card);border-radius:28px;box-shadow:var(--sh);min-height:0;overflow:auto}
.side{padding:24px 14px;display:flex;flex-direction:column;gap:4px}
.lg{font-weight:800;font-size:22px;letter-spacing:-.02em;padding:0 12px 18px}
.lb{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);padding:18px 12px 6px}
.nv{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:16px;font-weight:600;color:var(--slate);text-align:left;white-space:nowrap}
.nv span{overflow:hidden;text-overflow:ellipsis}
.nv.on{background:var(--soft);color:var(--ink);font-weight:800}
.ib{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--slate);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.act{color:var(--sig)}
.liked{color:var(--ink)}.liked .i{fill:currentColor}
#npf{padding:4px 8px}
#npf input,.srch{width:100%;box-sizing:border-box;height:44px;border-radius:16px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:0 14px;font:inherit}
main{padding:28px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;gap:12px;align-items:center}
.btn{height:48px;padding:0 22px;border-radius:18px;font-weight:700;display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.dk{background:var(--ink);color:var(--on)}.sf{background:var(--soft)}
h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.01em;outline:0}
.sub{font-size:13px;color:var(--slate);margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 4px;border-radius:18px}
.row.on{background:var(--soft)}
.idx{width:44px;height:44px;color:var(--slate);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.row.on .idx{color:var(--ink)}
.t{flex:1;min-width:0}.t b,.t em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t b{font-weight:700}.t em{font-style:normal;font-size:13px;color:var(--slate)}
.d{font-size:13px;color:var(--slate);width:44px;text-align:right}
.empty{border:2px dashed var(--line);border-radius:28px;padding:56px 24px;text-align:center;color:var(--slate);display:flex;flex-direction:column;align-items:center;gap:16px}
#qp{padding:24px 16px}
#qp h2{margin:0 8px 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.qi{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 12px;border-radius:16px;cursor:grab}
.qi.on{background:var(--soft)}.qi .t{cursor:pointer}
.bar{display:grid;grid-template-columns:1fr 1.8fr 1fr;align-items:center;gap:16px;padding:14px 20px;grid-column:1/-1;overflow:hidden}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.art{width:52px;height:52px;border-radius:14px;flex:none;background:radial-gradient(circle,#D9DDE3 0 27%,#14171C 29%)}
.mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px}
.big{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--on);display:flex;align-items:center;justify-content:center}
.big .i{fill:currentColor}
.wv{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--slate)}
#wave{flex:1;display:flex;align-items:center;gap:3px;height:40px;cursor:pointer}
#wave i{flex:1;border-radius:2px;background:var(--ink);min-width:2px}
#wave i.o{background:var(--off)}
.rt{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--slate)}
.vl{display:flex;align-items:center;gap:8px}
#vol{width:100px;accent-color:var(--ink)}
.menu{position:fixed;z-index:9;background:var(--card);border-radius:20px;box-shadow:0 12px 32px rgba(20,23,28,.25);padding:8px;display:flex;flex-direction:column;min-width:180px;max-height:50%;overflow:auto;border:1px solid var(--line)}
.menu button,.menu span{padding:12px 14px;border-radius:12px;text-align:left;font-weight:600}
.menu span{color:var(--slate);font-size:13px}.menu button:hover{background:var(--soft)}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:12px 20px;border-radius:999px;font-weight:600;z-index:10}
small{font-size:9px;font-weight:800;margin-left:-6px;margin-top:-12px}
@media(max-width:1000px){#app{grid-template-columns:200px 1fr}#qp{display:none;position:fixed;right:16px;top:16px;bottom:150px;width:min(320px,calc(100% - 32px));z-index:5}#qp.show{display:block}}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:10px}
.side{flex-direction:row;overflow-x:auto;padding:8px;align-items:center;border-radius:22px}.lg,.lb{display:none}#pls{display:contents}#npf{display:none!important}
main{padding:18px}.bar{grid-template-columns:1fr;gap:8px;padding:12px 14px}.rt .vl{display:none}.rt{position:absolute;right:14px;top:10px}.bar{position:relative}h1{font-size:26px}.d{display:none}}
</style>
</head>
<body>
<div id="app">
<nav class="pan side" id="side" aria-label="Library">
<div class="lg">SyncTune</div>
<button class="nv on" data-v="lib"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 15.5V9l4-1v6.5"/><circle cx="9" cy="15.5" r="1.3"/><circle cx="13" cy="14.5" r="1.3"/></svg><span>Library</span></button>
<button class="nv" data-v="liked"><svg class="i" viewBox="0 0 24 24"><path d="M12 20C6 16 4 13 4 9.8 4 7.5 5.7 6 7.7 6c1.6 0 3.200 1 4.300 2.700C13.100 7 14.700 6 16.300 6 18.300 6 20 7.500 20 9.800 20 13 18 16 12 20z"/></svg><span>Liked songs</span></button>
<div class="lb">Playlists <button class="ib" id="npb" aria-label="New playlist" style="width:36px;height:36px"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
<form id="npf" hidden><input id="npi" placeholder="Playlist name" aria-label="Playlist name" maxlength="40"></form>
<div id="pls"></div>
</nav>

<main class="pan" id="main">
<div class="top">
<input class="srch" id="srch" type="search" placeholder="Search your songs" aria-label="Search your songs">
<button class="btn dk" data-a="add"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add music</button>
</div>
<div class="head">
<div><h1 id="vt">Your library</h1><div class="sub" id="vc"></div></div>
<div class="acts">
<button class="btn dk" data-a="playall"><svg class="i" viewBox="0 0 24 24" style="fill:currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>Play</button>
<button class="btn sf" data-a="shufall"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h3.500c5 0 5 10 10 10H21M3 17h3.500c1.500 0 2.600-.700 3.500-1.800M14 8.800c.900-1.100 2-1.800 3.500-1.800H21M18.500 4.500L21 7l-2.500 2.500M18.500 14.500L21 17l-2.500 2.500"/></svg>Shuffle</button>
<button class="btn sf" data-a="delpl" id="delpl" hidden>Delete playlist</button>
</div>
</div>
<div id="list"></div>
</main>

<aside class="pan" id="qp" aria-label="Queue"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Up next</h2><button class="btn" id="qclr" style="height:36px;font-size:13px;color:var(--slate)">Clear</button></div><div class="sub" style="margin:0 8px 10px">Drag songs to reorder</div><div id="ql"></div></aside>

<footer class="pan bar">
<div class="now"><div class="art"></div><div class="t"><b id="bt">Nothing playing</b><em id="ba">Add music to get started</em></div><button class="ib" id="bl" aria-label="Like"><svg class="i" viewBox="0 0 24 24"><path d="M12 20C6 16 4 13 4 9.800 4 7.500 5.700 6 7.700 6c1.600 0 3.200 1 4.300 2.700C13.100 7 14.700 6 16.300 6 18.300 6 20 7.500 20 9.800 20 13 18 16 12 20z"/></svg></button></div>
<div class="mid">
<div class="ctl">
<button class="ib" id="bs" aria-label="Shuffle"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h3.500c5 0 5 10 10 10H21M3 17h3.500c1.500 0 2.600-.700 3.500-1.800M14 8.800c.900-1.100 2-1.800 3.500-1.800H21M18.500 4.500L21 7l-2.500 2.500M18.500 14.500L21 17l-2.500 2.500"/></svg></button>
<button class="ib" id="bprev" aria-label="Previous" style="color:var(--ink)"><svg class="i" viewBox="0 0 24 24"><path d="M18 5v14L8 12z"/><path d="M6 5v14"/></svg></button>
<button class="big" id="bp" aria-label="Play or pause"></button>
<button class="ib" id="bnext" aria-label="Next" style="color:var(--ink)"><svg class="i" viewBox="0 0 24 24"><path d="M6 5v14l10-7z"/><path d="M18 5v14"/></svg></button>
<button class="ib" id="br" aria-label="Repeat"></button>
</div>
<div class="wv"><span id="tc">0:00</span><div id="wave" role="slider" tabindex="0" aria-label="Seek"></div><span id="td">0:00</span></div>
</div>
<div class="rt"><label class="vl"><svg class="i" viewBox="0 0 24 24"><path d="M4 10v4h3.500L12 18V6L7.500 10z"/><path d="M15.500 9a4 4 0 0 1 0 6M18 6.500a8 8 0 0 1 0 11"/></svg><input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"></label>
<button class="ib" id="qt" aria-label="Show queue"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h6"/><circle cx="18" cy="17" r="2"/><path d="M20 17V8l2 1"/></svg></button></div>
</footer>
</div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac" multiple hidden>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const IC={play:'<path d="M8 5.5v13l11-6.5z"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="2.6"/>',repeat:'<path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/>',like:'<path d="M12 20C6 16 4 13 4 9.8 4 7.5 5.7 6 7.7 6c1.6 0 3.2 1 4.3 2.7C13.1 7 14.7 6 16.3 6 18.3 6 20 7.5 20 9.8 20 13 18 16 12 20z"/>',queue:'<path d="M4 7h11M4 12h11M4 17h6"/><circle cx="18" cy="17" r="2"/><path d="M20 17V8l2 1"/>',addpl:'<path d="M4 7h10M4 12h7M4 17h7M17 12v8M13 16h8"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',eq:'<path d="M6 20V10M12 20V4M18 20v-7" stroke-width="2.4"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
let meta=load('st_meta',[]),pls=load('st_pls',[]);
function save(){try{localStorage.setItem('st_meta',JSON.stringify(meta.filter(s=>!s.temp)));localStorage.setItem('st_pls',JSON.stringify(pls))}catch(e){}}
let dbp;function db(){return dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('synctune',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})}
const blobs=new Map(),urls=new Map(),au=new Audio();
async function blobOf(id){if(!blobs.has(id)){try{blobs.set(id,await idb('readonly',st=>st.get(id)))}catch(e){}}return blobs.get(id)}
let queue=[],qi=-1,shuf=false,rep=0,view='lib',wid=null,tt;
const by=id=>meta.find(s=>s.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function parse(n){const b=n.replace(/\.[^.]+$/,'').replace(/_/g,' ');const m=b.split(' - ');return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{artist:'Unknown artist',title:b.trim()}}
function getDur(s,f){const a=new Audio(),u=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{s.dur=a.duration||0;URL.revokeObjectURL(u);save();renderList()};a.onerror=()=>URL.revokeObjectURL(u);a.src=u}
async function addFiles(fl){let n=0;for(const f of fl){if(!f.type.startsWith('audio')&&!/\.(mp3|m4a|wav|ogg|flac)$/i.test(f.name))continue;
const id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const s={id,...parse(f.name),dur:0,liked:false};blobs.set(id,f);
try{await idb('readwrite',st=>st.put(f,id))}catch(e){s.temp=true}
meta.push(s);n++;getDur(s,f)}
save();render();toast(n?`Added ${n} song${n>1?'s':''}`:'No audio files found')}
function shuffleQ(cur){const r=queue.filter(x=>x!==cur);for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}queue=cur?[cur,...r]:r;qi=cur?0:-1}
async function playId(id,newQ){if(newQ){queue=newQ.slice();if(shuf)shuffleQ(id)}
qi=queue.indexOf(id);if(qi<0){queue.push(id);qi=queue.length-1}
const b=await blobOf(id);if(!b){toast('File missing. Please add this song again.');return}
let u=urls.get(id);if(!u){u=URL.createObjectURL(b);urls.set(id,u)}
au.src=u;try{await au.play()}catch(e){}renderBar();renderQ();renderList()}
function next(auto){if(!queue.length)return;if(auto&&rep===2){au.currentTime=0;au.play();return}
let i=qi+1;if(i>=queue.length){if(rep===1||!auto)i=0;else{au.pause();renderBar();return}}playId(queue[i])}
function prev(){if(!queue.length)return;if(au.currentTime>3){au.currentTime=0;return}playId(queue[(qi-1+queue.length)%queue.length])}
function toggle(){if(au.src){au.paused?au.play():au.pause()}else{const l=songsOf();if(l.length)playId(l[0].id,l.map(s=>s.id))}}
au.onended=()=>next(true);au.onplay=au.onpause=()=>{renderBar();renderList()};
au.ontimeupdate=()=>{$('#tc').textContent=fmt(au.currentTime);$('#td').textContent=fmt(au.duration);const n=Math.floor(au.currentTime/(au.duration||1)*64);document.querySelectorAll('#wave i').forEach((b,i)=>b.classList.toggle('o',i>=n))};
function songsOf(){let a;if(view==='lib')a=meta;else if(view==='liked')a=meta.filter(s=>s.liked);else{const p=pls.find(p=>p.id===view);a=p?p.ids.map(by).filter(Boolean):[]}
const q=$('#srch').value.trim().toLowerCase();return q?a.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(q)):a}
function row(s,i,inPl){const cur=s.id===queue[qi];return `<div class="row ${cur?'on':''}" data-id="${s.id}"><button class="idx" data-a="play" aria-label="Play ${esc(s.title)}">${cur&&!au.paused?ic('eq'):i+1}</button><div class="t"><b>${esc(s.title)}</b><em>${esc(s.artist)}</em></div><span class="d">${fmt(s.dur)}</span><button class="ib ${s.liked?'liked':''}" data-a="like" aria-label="Like">${ic('like')}</button><button class="ib" data-a="q" aria-label="Add to queue">${ic('queue')}</button><button class="ib" data-a="pl" aria-label="Add to playlist">${ic('addpl')}</button>${view==='liked'?'':`<button class="ib" data-a="del" aria-label="${inPl?'Remove from playlist':'Delete song'}">${ic('x')}</button>`}</div>`}
function renderNav(){document.querySelectorAll('#side [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
$('#pls').innerHTML=pls.map(p=>`<button class="nv ${p.id===view?'on':''}" data-v="${p.id}">${ic('queue')}<span>${esc(p.name)}</span></button>`).join('')}
function renderList(){const a=songsOf(),p=pls.find(p=>p.id===view),vt=$('#vt');
vt.textContent=view==='lib'?'Your library':view==='liked'?'Liked songs':p?p.name:'Your library';vt.contentEditable=p?'true':'false';
$('#vc').textContent=a.length+' song'+(a.length===1?'':'s')+(p?' · click the name to rename':'');
const d=$('#delpl');d.hidden=!p;d.textContent='Delete playlist';delete d.dataset.sure;
$('#list').innerHTML=a.length?a.map((s,i)=>row(s,i,!!p)).join(''):`<div class="empty"><div>${meta.length?'Nothing here yet.':'Your library is empty. Drop MP3 files anywhere on this page, or pick them from your device.'}</div>${meta.length?'':'<button class="btn dk" data-a="add">Add music</button>'}</div>`}
function renderQ(){$('#ql').innerHTML=queue.length?queue.map((id,i)=>{const s=by(id);return s?`<div class="qi ${i===qi?'on':''}" draggable="true" data-i="${i}"><div class="t" data-a="qplay"><b>${esc(s.title)}</b><em>${esc(s.artist)}</em></div><button class="ib" data-a="qrm" aria-label="Remove from queue">${ic('x')}</button></div>`:''}).join(''):'<div class="sub" style="margin:8px">Queue is empty. Play a song or add some with the queue button.</div>'}
function buildWave(id){let h=0;for(const c of id||'x')h=(h*31+c.charCodeAt(0))|0;let o='';for(let i=0;i<64;i++){h=(h*1103515245+12345)|0;o+=`<i class="o" style="height:${8+Math.abs(h>>8)%32}px"></i>`}$('#wave').innerHTML=o}
function renderBar(){const s=by(queue[qi]);$('#bt').textContent=s?s.title:'Nothing playing';$('#ba').textContent=s?s.artist:'Add music to get started';
$('#bp').innerHTML=ic(au.paused?'play':'pause');$('#bl').classList.toggle('liked',!!s&&s.liked);$('#bs').classList.toggle('act',shuf);
const r=$('#br');r.classList.toggle('act',rep>0);r.innerHTML=ic('repeat')+(rep===2?'<small>1</small>':'');
if(wid!==(s?s.id:'')){wid=s?s.id:'';buildWave(wid)}}
function render(){renderNav();renderList();renderQ();renderBar()}
function openMenu(btn,id){const m=$('#menu');m.innerHTML=(pls.length?pls.map(p=>`<button data-p="${p.id}">${esc(p.name)}</button>`).join(''):'<span>No playlists yet</span>')+'<button data-p="new">+ New playlist</button>';
m.dataset.id=id;m.hidden=false;const r=btn.getBoundingClientRect();m.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-m.offsetHeight-8))+'px';m.style.left=Math.max(8,Math.min(r.left-120,innerWidth-m.offsetWidth-8))+'px'}
async function removeSong(id){if(view!=='lib'){const p=pls.find(p=>p.id===view);if(p){p.ids=p.ids.filter(x=>x!==id);save();render()}return}
meta=meta.filter(s=>s.id!==id);pls.forEach(p=>p.ids=p.ids.filter(x=>x!==id));const i=queue.indexOf(id);
if(i>=0){queue.splice(i,1);if(i===qi){au.pause();au.removeAttribute('src');qi=-1}else if(i<qi)qi--}
blobs.delete(id);urls.delete(id);try{await idb('readwrite',st=>st.delete(id))}catch(e){}save();render();toast('Removed')}
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=b.closest('[data-id]'),id=r&&r.dataset.id,a=b.dataset.a;
if(a==='add')$('#file').click();
else if(a==='playall'){const l=songsOf();if(l.length)playId(l[0].id,l.map(s=>s.id))}
else if(a==='shufall'){const l=songsOf();if(l.length){shuf=true;const ids=l.map(s=>s.id);playId(ids[Math.floor(Math.random()*ids.length)],ids)}}
else if(a==='play')playId(id,songsOf().map(s=>s.id));
else if(a==='like'){const s=by(id);s.liked=!s.liked;save();render()}
else if(a==='q'){if(queue.includes(id))toast('Already in queue');else{queue.push(id);renderQ();toast('Added to queue')}}
else if(a==='pl')openMenu(b,id);
else if(a==='del')removeSong(id);
else if(a==='delpl'){if(b.dataset.sure){pls=pls.filter(p=>p.id!==view);view='lib';save();render()}else{b.dataset.sure=1;b.textContent='Click again to delete'}}});
$('#menu').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const id=$('#menu').dataset.id;let p;
if(b.dataset.p==='new'){p={id:'p'+Date.now().toString(36),name:'Playlist '+(pls.length+1),ids:[]};pls.push(p)}else p=pls.find(x=>x.id===b.dataset.p);
if(!p.ids.includes(id))p.ids.push(id);save();$('#menu').hidden=true;render();toast('Added to '+p.name)});
document.addEventListener('click',e=>{if(!e.target.closest('#menu,[data-a="pl"]'))$('#menu').hidden=true});
$('#side').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v){view=b.dataset.v;$('#srch').value='';render()}else if(b.id==='npb'){$('#npf').hidden=!$('#npf').hidden;$('#npi').focus()}});
$('#npf').onsubmit=e=>{e.preventDefault();const n=$('#npi').value.trim();if(!n)return;const p={id:'p'+Date.now().toString(36),name:n,ids:[]};pls.push(p);$('#npi').value='';$('#npf').hidden=true;view=p.id;save();render()};
const vt=$('#vt');vt.onblur=()=>{const p=pls.find(p=>p.id===view);if(p){const n=vt.textContent.trim();if(n){p.name=n.slice(0,40);save();renderNav()}else vt.textContent=p.name}};vt.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();vt.blur()}};
$('#srch').oninput=renderList;
const ql=$('#ql');let dr=-1;
ql.addEventListener('click',e=>{const b=e.target.closest('[data-a]');const r=e.target.closest('.qi');if(!b||!r)return;const i=+r.dataset.i;
if(b.dataset.a==='qplay')playId(queue[i]);else{const cur=queue[qi];queue.splice(i,1);qi=queue.indexOf(cur);if(cur&&i===qi+0&&qi<0){au.pause();au.removeAttribute('src')}renderQ();renderBar()}});
ql.ondragstart=e=>{const r=e.target.closest('.qi');if(r)dr=+r.dataset.i};ql.ondragover=e=>e.preventDefault();
ql.ondrop=e=>{e.preventDefault();const r=e.target.closest('.qi');if(!r||dr<0)return;const cur=queue[qi],[m]=queue.splice(dr,1);queue.splice(+r.dataset.i,0,m);qi=queue.indexOf(cur);dr=-1;renderQ()};
$('#qclr').onclick=()=>{const cur=queue[qi];queue=cur?[cur]:[];qi=cur?0:-1;renderQ()};
$('#qt').onclick=()=>$('#qp').classList.toggle('show');
$('#bp').onclick=toggle;$('#bnext').onclick=()=>next();$('#bprev').onclick=prev;
$('#bs').onclick=()=>{shuf=!shuf;if(shuf&&queue.length)shuffleQ(queue[qi]);renderBar();renderQ()};
$('#br').onclick=()=>{rep=(rep+1)%3;renderBar()};
$('#bl').onclick=()=>{const s=by(queue[qi]);if(s){s.liked=!s.liked;save();render()}};
$('#vol').oninput=e=>au.volume=+e.target.value;
const wave=$('#wave');wave.onclick=e=>{const r=wave.getBoundingClientRect();if(au.duration)au.currentTime=(e.clientX-r.left)/r.width*au.duration};
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
addEventListener('keydown',e=>{const t=e.target;if(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable)return;
if(e.code==='Space'){if(t.tagName==='BUTTON')return;e.preventDefault();toggle()}
else if(e.key==='ArrowRight'){e.shiftKey?next():au.currentTime+=5}else if(e.key==='ArrowLeft'){e.shiftKey?prev():au.currentTime-=5}});
render();
</script>
</body>
</html>
